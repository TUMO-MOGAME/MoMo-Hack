<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MoMo Kasi">
  <!--
    A6-02: there was no favicon at all — /favicon.ico returned 404 and the
    browser tab showed a blank sheet beside every other submission.

    Deliberately not the wordmark: at 16px a word is a smudge. This is the
    product's one idea as a shape — money arriving (the coin) and splitting
    (the three parts below it) — which is still legible as a silhouette when
    it is sixteen pixels wide on a phone's tab strip.

    Colours are literal because an SVG asset cannot read a CSS variable, and a
    tab icon must look the same whatever theme the page is in. They are the
    dark-theme --background and --brand from src/design/tokens.ts. If the brand
    changes, change them here too (A2-02 is the same class of duplication, and
    is noted in the audit).
  -->
  <rect width="64" height="64" rx="14" fill="#000000" />
  <circle cx="32" cy="22" r="10.5" fill="#FFCB05" />
  <rect x="12" y="40" width="18" height="5.5" rx="2.75" fill="#FFCB05" />
  <rect x="34" y="40" width="18" height="5.5" rx="2.75" fill="#FFCB05" opacity="0.72" />
  <rect x="12" y="49.5" width="11" height="5.5" rx="2.75" fill="#FFCB05" opacity="0.48" />
  <rect x="27" y="49.5" width="25" height="5.5" rx="2.75" fill="#FFCB05" opacity="0.3" />
</svg>
